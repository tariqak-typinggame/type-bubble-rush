</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><div><span class="tag">HULL</span><div class="meter"><i id="hp"></i></div></div><div class="right"><span class="tag">LEVEL <b id="lv">1</b> · SCORE <b id="sc">000000</b></span><span class="tag">BEST <b id="best">000000</b> · WEAPON ×<b id="pw">1</b></span></div></div><div id="banner" class="banner"></div><div id="screen" class="screen"><h1>SKY STRIKE<br><span>INFINITY</span></h1><p>Arrow keys to fly · Weapons fire automatically<br>Clear the wave, destroy the boss, upgrade your jet.</p><div class="start">TAP / PRESS ENTER TO DEPLOY</div></div></div><div id="stick" class="stick"><b></b></div>
<script>(()=>{'use strict';const c=document.querySelector('#c'),g=c.getContext('2d'),hp=document.querySelector('#hp'),sc=document.querySelector('#sc'),lv=document.querySelector('#lv'),pw=document.querySelector('#pw'),bestEl=document.querySelector('#best'),banner=document.querySelector('#banner'),screen=document.querySelector('#screen'),stick=document.querySelector('#stick');let W,H,D,now=0,last=0,playing=false,paused=false,score=0,best=+localStorage.getItem('sky-strike-best')||0,level=1,phase='wave',quota=0,kills=0,spawn=0,timer=0,shake=0,player,shots=[],foes=[],drops=[],fx=[],stars=[],clouds=[],key={},touch={on:false,x:0,y:0},audio=null,lastTone=0,leaderboard=[];bestEl.textContent=best.toString().padStart(6,'0');const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),ds=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);stars=Array.from({length:Math.ceil(W*H/7000)},()=>({x:R(0,W),y:R(0,H),v:R(15,65),s:R(.5,2),a:R(.2,.9)}));clouds=Array.from({length:9},()=>({x:R(-W,W),y:R(0,H),v:R(7,20),s:R(.35,1.4),a:R(.02,.08)}))}addEventListener('resize',resize);resize();
function pop(X,Y,n,col,sp=150){for(let i=0;i<n;i++){let a=R(0,7),v=R(sp*.2,sp);fx.push({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:R(.25,.8),s:R(1,4),col})}}
function message(s){banner.textContent=s;banner.classList.add('on');setTimeout(()=>banner.classList.remove('on'),1600)}
function loadBoard(){try{leaderboard=JSON.parse(localStorage.getItem('sky-strike-leaderboard')||'[]')}catch(e){leaderboard=[]}}
function boardText(){return leaderboard.slice(0,3).map((p,i)=>(i+1)+'. '+p.name+' — '+p.score.toLocaleString()).join('<br>')||'No pilots recorded yet'}
function saveBoard(){let qualifies=leaderboard.length<3||score>leaderboard[leaderboard.length-1].score;if(qualifies){let name=(prompt('NEW HIGH SCORE! Enter your pilot name:','PILOT')||'PILOT').trim().slice(0,12)||'PILOT';leaderboard.push({name,score:Math.floor(score)});leaderboard.sort((a,b)=>b.score-a.score);leaderboard=leaderboard.slice(0,12);localStorage.setItem('sky-strike-leaderboard',JSON.stringify(leaderboard))}}
function initAudio(){if(audio)return;let A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=new A();setInterval(()=>{if(!playing||paused||!audio)return;let notes=[98,110,123,147,165],f=notes[(Math.floor(now/640)+level)%notes.length];tone(f,.42,'sine',.025)},640)}
function tone(f,d,type='sine',v=.05){if(!audio)return;let o=audio.createOscillator(),q=audio.createGain();o.type=type;o.frequency.value=f;q.gain.setValueAtTime(.0001,audio.currentTime);q.gain.exponentialRampToValueAtTime(v,audio.currentTime+.015);q.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(q);q.connect(audio.destination);o.start();o.stop(audio.currentTime+d+.03)}
function sfx(k){if(!audio)return;if(k==='fire'){if(now-lastTone<260)return;lastTone=now;tone(240,.045,'square',.012)}if(k==='missile')tone(115,.16,'sawtooth',.04);if(k==='boom')tone(68,.25,'sawtooth',.055);if(k==='pickup')tone(660,.12,'triangle',.04);if(k==='clear'){tone(392,.2,'triangle',.05);setTimeout(()=>tone(587,.28,'triangle',.05),110)}}
loadBoard()
const exitBtn=document.createElement('button');exitBtn.textContent='EXIT MENU';exitBtn.style.cssText='position:fixed;right:18px;bottom:18px;z-index:10;padding:9px 13px;border:1px solid #73e9ff;border-radius:4px;background:#08253c;color:#e8fcff;font:700 13px Impact,Arial;letter-spacing:.08em;box-shadow:0 0 14px #00111f';document.body.append(exitBtn);function exitMenu(){playing=false;paused=false;foes=[];shots=[];drops=[];screen.innerHTML='<h1>SKY STRIKE<br><span>INFINITY</span></h1><p>ARCADE AIR COMMAND<br><br><b>TOP PILOTS</b><br>'+boardText()+'</p><div class="start">TAP / PRESS ENTER TO DEPLOY</div>';screen.classList.remove('hide')}exitBtn.onclick=exitMenu
document.head.insertAdjacentHTML('beforeend','<style>.screen{padding:22px;background:linear-gradient(135deg,#031426aa,#072f49aa);border:1px solid #66dff466;border-radius:12px;box-shadow:0 14px 40px #0008}</style>')
setInterval(()=>{if(playing&&!paused&&player){player.hp-=.32;if(player.hp<=0){player.inv=0;hurt(999)}}},1000)
function jet(){return{x:W/2,y:H*.78,vx:0,vy:0,hp:100,r:20,gun:0,missile:0,power:1,damage:1,rockets:0,inv:0,trail:0}}
function begin(){phase='wave';kills=0;quota=7+level*3;spawn=.8;timer=0;foes=[];shots=shots.filter(s=>s.good);let hue=[0,28,112,196,274][(level-1)%5];c.style.filter='hue-rotate('+hue+'deg) saturate('+(1+(level-1)*.06)+')';message('LEVEL '+level+' · '+['BLUE SKY','SUNSET STORM','EMERALD FRONT','VIOLET NEBULA','CRIMSON VOID'][(level-1)%5]+' · DESTROY '+quota+' FIGHTERS')}
function reset(){initAudio();if(audio.state==='suspended')audio.resume();score=0;level=1;shots=[];foes=[];drops=[];fx=[];player=jet();playing=true;screen.classList.add('hide');begin();ui()}
function ui(){hp.style.width=cl(player?.hp||100,0,100)+'%';sc.textContent=Math.floor(score).toString().padStart(6,'0');lv.textContent=level;pw.textContent=player?player.power:1;if(score>best){best=Math.floor(score);localStorage.setItem('sky-strike-best',best);bestEl.textContent=best.toString().padStart(6,'0')}}
function fire(){if(player.gun>0)return;player.gun=Math.max(.10,.18-player.power*.008);for(let i=0;i<player.power;i++){let o=(i-(player.power-1)/2)*10;shots.push({x:player.x+o,y:player.y-25,vx:o*.5,vy:-710,r:4,good:true,life:1.5,dmg:player.damage})}sfx('fire');pop(player.x,player.y-22,2,'#6ef5ff',40)}
function rocket(){if(!player.rockets||player.missile>0||!foes.length)return;player.missile=Math.max(.85,1.6-player.rockets*.12);shots.push({x:player.x,y:player.y-28,vx:0,vy:-290,r:7,good:true,life:3.5,dmg:4+player.rockets*2,rocket:true});sfx('missile')}
function enemy(kind){let speed=55+(level-1)*12,e={kind,x:R(42,W-42),y:-45,r:18,hp:1,max:1,vx:R(-42,42),vy:speed,cd:R(1.2,2.2),spin:R(0,6),val:110};if(kind==='ace'){let h=3+Math.floor(level*.8);Object.assign(e,{r:26,hp:h,max:h,vx:R(-65,65),vy:speed*.75,val:420,wave:R(1,4)})}if(kind==='boss'){let h=82+(level-1)*38;Object.assign(e,{x:W/2,y:130,r:76,hp:h,max:h,vx:72+(level-1)*12,vy:0,cd:.9,val:4500,boss:true})}foes.push(e)}
function hostile(e){let a=Math.atan2(player.y-e.y,player.x-e.x),n=e.boss?Math.min(7,3+level):1;for(let i=0;i<n;i++){let q=a+(i-(n-1)/2)*(e.boss?.14:0);shots.push({x:e.x,y:e.y+e.r*.45,vx:Math.cos(q)*R(105,175),vy:Math.sin(q)*R(105,175),r:e.boss?6:4,good:false,life:6,dmg:e.boss?Math.min(18,8+level*2):Math.min(10,4+level)})}}
function item(X,Y,type){drops.push({x:X,y:Y,vx:R(-42,42),vy:R(25,65),r:10,life:11,type})}
function hurt(v){if(player.inv>0)return;player.hp-=v;player.inv=.7;shake=11;pop(player.x,player.y,22,'#ffba51',190);if(player.hp<=0){playing=false;player.hp=0;pop(player.x,player.y,65,'#ff6548',340);sfx('boom');saveBoard();screen.innerHTML='<h1>MISSION<br><span>FAILED</span></h1><p>Score '+Math.floor(score).toLocaleString()+' · Best '+best.toLocaleString()+'</p><p><b>TOP PILOTS</b><br>'+boardText()+'</p><div class="start">TAP / PRESS ENTER TO FLY AGAIN</div>';screen.classList.remove('hide')}}
function slain(e,v){e.hp-=v;pop(e.x,e.y,5,'#ffca68',80);if(e.hp>0)return;foes.splice(foes.indexOf(e),1);score+=e.val;pop(e.x,e.y,e.boss?95:23,e.boss?'#f66451':'#ffb75a',e.boss?340:200);sfx('boom');shake=e.boss?22:5;if(e.boss){item(e.x,e.y,'fuel');if(level%3===0)item(e.x+28,e.y,'fire');if(level%4===0)item(e.x-28,e.y,'missile');phase='clear';timer=2.5;if(level%3===0)player.power=Math.min(4,player.power+1);if(level%3===0)player.damage++;if(level%4===0)player.rockets=Math.min(2,player.rockets+1);player.hp=cl(player.hp+8,0,100);sfx('clear');message('LEVEL '+level+' CLEARED · NEXT SECTOR READY');return}kills++;let r=Math.random();if(r<.045)item(e.x,e.y,'fuel');else if(r<.075)item(e.x,e.y,'fire');else if(r<.09)item(e.x,e.y,'missile');if(kills>=quota&&phase==='wave'){phase='boss';timer=1.6;message('WAVE CLEAR · BOSS INCOMING')}}
function take(q){q.life=0;score+=250;sfx('pickup');if(q.type==='fuel'){player.hp=cl(player.hp+10,0,100);message('FUEL +10')}if(q.type==='fire'){player.damage=Math.min(4,player.damage+1);message('FIRE POWER UP')}if(q.type==='missile'){player.rockets=Math.min(2,player.rockets+1);message('MISSILE SYSTEM ONLINE')}pop(q.x,q.y,18,q.type==='fuel'?'#63ff91':q.type==='fire'?'#ffd35d':'#fc8cff',150)}
function step(dt){if(!playing||paused)return;score+=dt*5;let ax=(key.ArrowRight?1:0)-(key.ArrowLeft?1:0),ay=(key.ArrowDown?1:0)-(key.ArrowUp?1:0);if(touch.on){ax=(touch.x-player.x)/90;ay=(touch.y-player.y)/90}let z=Math.hypot(ax,ay);if(z>1){ax/=z;ay/=z}player.vx+=(ax*900-player.vx)*Math.min(1,dt*9);player.vy+=(ay*900-player.vy)*Math.min(1,dt*9);player.x=cl(player.x+player.vx*dt,26,W-26);player.y=cl(player.y+player.vy*dt,45,H-26);player.gun-=dt;player.missile-=dt;player.inv-=dt;fire();rocket();player.trail-=dt;if(player.trail<0){player.trail=.025;fx.push({x:player.x+R(-8,8),y:player.y+24,vx:R(-20,20),vy:R(80,160),life:.35,s:R(3,7),col:'#2de8ff'})}timer-=dt;if(phase==='wave'){spawn-=dt;if(spawn<=0&&kills<quota){enemy(Math.random()<Math.min(.08+(level-1)*.07,.38)?'ace':'drone');spawn=Math.max(.32,1.25-(level-1)*.11)}}else if(phase==='boss'&&timer<=0&&foes.length===0){enemy('boss');phase='fight';message('DESTROY THE BOSS FUEL CORE')}else if(phase==='clear'&&timer<=0){level++;begin()}for(let s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=R(0,W)}}for(let k of clouds){k.y+=k.v*dt;if(k.y>H+160){k.y=-160;k.x=R(-W*.3,W)}}for(let b of shots){if(b.rocket){let t=foes.reduce((a,e)=>!a||ds(b,e)<ds(b,a)?e:a,null);if(t){let a=Math.atan2(t.y-b.y,t.x-b.x);b.vx+=(Math.cos(a)*340-b.vx)*dt*4;b.vy+=(Math.sin(a)*340-b.vy)*dt*4}}b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}shots=shots.filter(b=>b.life>0&&b.y>-90&&b.y<H+100&&b.x>-90&&b.x<W+90);for(let e of foes){e.spin+=dt*2;e.x+=e.vx*dt;if(e.boss){e.y=130+Math.sin(now*.0014)*42}else{e.y+=e.vy*dt;if(e.kind==='ace')e.x+=Math.sin(e.spin*2)*e.wave*13;if(e.y>H*.58){e.y=H*.58;e.vy=0}}if(e.x<e.r||e.x>W-e.r)e.vx*=-1;e.cd-=dt;if(e.cd<0&&(e.boss||level>1||e.kind==='ace')){hostile(e);e.cd=e.boss?Math.max(.34,.78-level*.045):Math.max(.9,2.15-level*.12)}}for(let b of [...shots]){if(b.good){for(let e of [...foes])if(ds(b,e)<b.r+e.r){shots.splice(shots.indexOf(b),1);slain(e,b.dmg);break}}else if(ds(b,player)<b.r+player.r){shots.splice(shots.indexOf(b),1);hurt(b.dmg)}}for(let e of [...foes])if(ds(e,player)<e.r+player.r){hurt(e.boss?35:20);if(!e.boss)slain(e,999)}for(let q of drops){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.98;q.vy*=.98;q.life-=dt;if(ds(q,player)<q.r+28)take(q)}drops=drops.filter(q=>q.life>0);for(let p of fx){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt}fx=fx.filter(p=>p.life>0);shake=Math.max(0,shake-dt*36);ui()}
function ship(X,Y,r,bad=false){g.save();g.translate(X,Y);g.scale(r/32,r/32);g.beginPath();g.moveTo(0,-31);g.lineTo(8,-8);g.lineTo(27,17);g.lineTo(8,13);g.lineTo(0,28);g.lineTo(-8,13);g.lineTo(-27,17);g.lineTo(-8,-8);g.closePath();let q=g.createLinearGradient(0,-30,0,28);q.addColorStop(0,bad?'#ffb05d':'#d9fbff');q.addColorStop(.5,bad?'#bf3a35':'#197aa9');q.addColorStop(1,bad?'#4c1226':'#072442');g.fillStyle=q;g.shadowBlur=bad?12:17;g.shadowColor=bad?'#ff4b38':'#26dfff';g.fill();g.strokeStyle=bad?'#ffd178':'#a8f9ff';g.lineWidth=1.4;g.stroke();g.restore()}
function draw(){g.setTransform(D,0,0,D,0,0);g.clearRect(0,0,W,H);let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#02091c');bg.addColorStop(.5,'#07375a');bg.addColorStop(1,'#06152f');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let q of clouds){g.save();g.globalAlpha=q.a;g.fillStyle='#d8f7ff';g.filter='blur(18px)';g.beginPath();g.ellipse(q.x,q.y,150*q.s,52*q.s,0,0,7);g.fill();g.restore()}for(let s of stars){g.globalAlpha=s.a;g.fillStyle='#dfffff';g.fillRect(s.x,s.y,s.s,s.s*2)}g.globalAlpha=1;g.save();if(shake)g.translate(R(-shake,shake),R(-shake,shake));for(let q of drops){let col=q.type==='fuel'?'#64ff95':q.type==='fire'?'#ffcf5b':'#fc88ff',tx=q.type==='fuel'?'F':q.type==='fire'?'P':'M';g.save();g.translate(q.x,q.y);g.rotate(now*.004);g.shadowBlur=19;g.shadowColor=col;g.fillStyle=col;g.beginPath();g.moveTo(0,-q.r);g.lineTo(q.r,0);g.lineTo(0,q.r);g.lineTo(-q.r,0);g.closePath();g.fill();g.fillStyle='#09203a';g.font='bold 11px system-ui';g.textAlign='center';g.rotate(-now*.004);g.fillText(tx,0,4);g.restore()}for(let p of fx){g.globalAlpha=cl(p.life/.8,0,1);g.fillStyle=p.col;g.shadowBlur=10;g.shadowColor=p.col;g.beginPath();g.arc(p.x,p.y,p.s,0,7);g.fill()}g.globalAlpha=1;for(let b of shots){g.strokeStyle=b.good?(b.rocket?'#ff92fa':'#74f8ff'):'#ff6c52';g.shadowBlur=12;g.shadowColor=g.strokeStyle;g.lineWidth=b.r;g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x-b.vx*.018,b.y-b.vy*.025);g.stroke()}for(let e of foes){if(e.boss){g.save();g.translate(e.x,e.y);g.shadowBlur=24;g.shadowColor='#fa5445';g.fillStyle='#73283a';g.beginPath();g.moveTo(-70,-20);g.lineTo(-42,42);g.lineTo(0,60);g.lineTo(42,42);g.lineTo(70,-20);g.lineTo(20,-63);g.lineTo(0,-82);g.lineTo(-20,-63);g.closePath();g.fill();g.strokeStyle='#ffd077';g.lineWidth=2;g.stroke();g.fillStyle='#58eaff';g.fillRect(-11,-38,22,18);g.restore();g.fillStyle='#050c17aa';g.fillRect(e.x-e.r,e.y-e.r-22,e.r*2,8);g.fillStyle='#5cff8f';g.fillRect(e.x-e.r,e.y-e.r-22,e.r*2*(e.hp/e.max),8);g.fillStyle='#d9ffff';g.font='11px system-ui';g.textAlign='center';g.fillText('BOSS FUEL',e.x,e.y-e.r-28)}else ship(e.x,e.y,e.r,true)}if(playing){g.globalAlpha=player.inv>0?(Math.sin(now*.03)>0?1:.25):1;ship(player.x,player.y,player.r);g.globalAlpha=1}g.restore()}
function loop(t){now=t;let dt=Math.min(.034,(t-last||16)/1000);last=t;step(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('keydown',e=>{key[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Enter'){if(!playing)reset();else if(paused){paused=false;screen.classList.add('hide')}}if(e.code==='Escape'&&playing){paused=!paused;screen.innerHTML='<h1>PAUSED</h1><p>Take a breath, pilot.</p><div class="start">PRESS ESC TO RESUME</div>';screen.classList.toggle('hide',!paused)}});addEventListener('keyup',e=>key[e.code]=false);c.addEventListener('pointerdown',e=>{if(!playing||paused){reset();return}touch.on=true;touch.x=e.clientX;touch.y=e.clientY});c.addEventListener('pointermove',e=>{if(touch.on){touch.x=e.clientX;touch.y=e.clientY}});c.addEventListener('pointerup',()=>touch.on=false);stick.addEventListener('pointerdown',e=>{touch.on=true;touch.x=e.clientX;touch.y=e.clientY})})();
</script></body></html>
